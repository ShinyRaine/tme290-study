<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TME290 自测 · 模拟卷 + 三套真题</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">TME290 <span>自主机器人</span> 备考站</a>
    <div class="links">
      <a href="index.html">知识手册</a>
      <a href="plan.html">复习计划</a>
      <a href="exam.html" class="active">自测</a>
    </div>
  </div>
</nav>

<div class="wrap">

<div class="hero">
  <h1 id="heroTitle">自测题库</h1>
  <p id="heroDesc">模拟卷 + 2024/2025/2026 三套真题。一题一页：<strong style="color:#fecaca">左 False</strong> / <strong style="color:#a7f3d0">右 True</strong>，答完自动进下一题。对 1 分、错/空 0 分，<strong>answer every question!</strong> 进度自动保存在本机。</p>
</div>

<div id="app"></div>

<div class="exam-actions" id="actions" style="display:none">
  <button class="btn primary" id="submitBtn">交卷判分</button>
  <button class="btn ghost" id="resetBtn">清空重做</button>
  <button class="btn ghost" id="pickBtn">切换试卷</button>
  <span class="progress" id="progress"></span>
</div>

</div>

<footer>做完复盘错题时，回<a href="index.html">知识手册</a>对应节看原理，不要只记答案。</footer>

<script src="exam-data.js"></script>
<script>
(function () {
  var appEl = document.getElementById('app');
  var actionsEl = document.getElementById('actions');
  var progressEl = document.getElementById('progress');
  var submitBtn = document.getElementById('submitBtn');
  var resetBtn = document.getElementById('resetBtn');
  var pickBtn = document.getElementById('pickBtn');
  var heroTitle = document.getElementById('heroTitle');
  var heroDesc = document.getElementById('heroDesc');

  var CUR_KEY = 'tme290-current-exam';
  var exam = null;   // 当前试卷（EXAMS 元素）
  var ALL = [];      // 当前试卷拍平后的题目
  var state = null;  // 当前试卷作答状态

  function storeKey(id) { return 'tme290-exam-v1-' + id; }
  function freshState() { return { answers: {}, submitted: false, idx: 0 }; }
  function loadState(id) {
    try { return JSON.parse(localStorage.getItem(storeKey(id))); } catch (e) { return null; }
  }
  function save() {
    if (exam) try { localStorage.setItem(storeKey(exam.id), JSON.stringify(state)); } catch (e) {}
  }
  function answeredCount() { return Object.keys(state.answers).length; }
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function flatten(ex) {
    var out = [];
    ex.sections.forEach(function (sec) {
      sec.questions.forEach(function (q) {
        out.push({ n: q.n, q: q.q, a: q.a, e: q.e, both: q.both, section: sec.section, context: sec.context });
      });
    });
    return out;
  }
  function isCorrect(q, user) {
    if (user === undefined) return false;
    if (q.both) return true;
    return user === (q.a ? 'T' : 'F');
  }

  // ---------- 选卷 ----------
  function openExam(id) {
    exam = null;
    for (var i = 0; i < EXAMS.length; i++) if (EXAMS[i].id === id) exam = EXAMS[i];
    if (!exam) { renderPicker(); return; }
    ALL = flatten(exam);
    state = loadState(id) || freshState();
    if (typeof state.idx !== 'number' || state.idx < 0) state.idx = 0;
    if (state.idx > ALL.length) state.idx = ALL.length;
    try { localStorage.setItem(CUR_KEY, id); } catch (e) {}
    render();
  }

  function backToPicker() {
    save();
    exam = null;
    try { localStorage.removeItem(CUR_KEY); } catch (e) {}
    renderPicker();
  }

  function examStatus(ex) {
    var st = loadState(ex.id);
    if (!st || (!st.submitted && !Object.keys(st.answers || {}).length)) return '未开始';
    var total = 0;
    ex.sections.forEach(function (s) { total += s.questions.length; });
    if (st.submitted) {
      var flat = flatten(ex), score = 0;
      flat.forEach(function (q) { if (st.answers[q.n] !== undefined && isCorrect(q, st.answers[q.n])) score++; });
      return '已交卷 · ' + score + ' / ' + total;
    }
    return '进行中 · 已答 ' + Object.keys(st.answers).length + ' / ' + total;
  }

  function renderPicker() {
    heroTitle.textContent = '自测题库';
    heroDesc.style.display = '';
    actionsEl.style.display = 'none';
    var html = '<div class="single">';
    EXAMS.forEach(function (ex) {
      var status = examStatus(ex);
      html +=
        '<div class="qcard exam-pick" data-id="' + ex.id + '">' +
          '<div class="meta"><span class="sec">' + escapeHtml(ex.gradeNote) + '</span><span>' + status + '</span></div>' +
          '<h2 style="margin:0.3rem 0 0.3rem;border:none;padding:0;font-size:1.15rem">' + escapeHtml(ex.title) + '</h2>' +
          '<p style="margin:0;color:var(--muted);font-size:0.92rem">' + escapeHtml(ex.subtitle) + '</p>' +
        '</div>';
    });
    html += '</div>';
    appEl.innerHTML = html;
    appEl.querySelectorAll('.exam-pick').forEach(function (card) {
      card.addEventListener('click', function () { openExam(card.dataset.id); });
    });
    window.scrollTo({ top: 0 });
  }

  // ---------- 答题 ----------
  function render() {
    heroTitle.textContent = exam.title;
    heroDesc.style.display = 'none';
    actionsEl.style.display = '';
    if (state.submitted) renderResult();
    else if (state.idx >= ALL.length) renderFinish();
    else renderQuestion();
    updateBar();
  }

  function updateBar() {
    progressEl.textContent = state.submitted ? '已交卷' : ('已答 ' + answeredCount() + ' / ' + ALL.length);
    submitBtn.style.display = state.submitted ? 'none' : '';
  }

  function renderQuestion() {
    var q = ALL[state.idx];
    var user = state.answers[q.n];
    var pct = Math.round(answeredCount() / ALL.length * 100);

    appEl.innerHTML =
      '<div class="single">' +
        '<div class="progressbar"><div style="width:' + pct + '%"></div></div>' +
        '<div class="qcard">' +
          '<div class="meta"><span class="sec">' + escapeHtml(q.section) + '</span><span>第 ' + (state.idx + 1) + ' / ' + ALL.length + ' 题</span></div>' +
          (q.context || '') +
          '<p class="stem-big">' + escapeHtml(q.q) + '</p>' +
          '<div class="big-tf">' +
            '<button class="bf' + (user === 'F' ? ' sel' : '') + '" id="btnF">✗ False</button>' +
            '<button class="bt' + (user === 'T' ? ' sel' : '') + '" id="btnT">✓ True</button>' +
          '</div>' +
          '<div class="qnav">' +
            '<button class="btn ghost" id="prevBtn"' + (state.idx === 0 ? ' disabled' : '') + '>← 上一题</button>' +
            '<button class="btn ghost" id="skipBtn">' + (user ? '下一题 →' : '跳过 →') + '</button>' +
          '</div>' +
          '<div class="kbd-hint">键盘：← False · → True · ⌫ 上一题</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btnF').addEventListener('click', function () { answer('F'); });
    document.getElementById('btnT').addEventListener('click', function () { answer('T'); });
    document.getElementById('prevBtn').addEventListener('click', function () { go(state.idx - 1); });
    document.getElementById('skipBtn').addEventListener('click', function () { go(state.idx + 1); });
  }

  function answer(v) {
    var q = ALL[state.idx];
    state.answers[q.n] = v;
    save();
    var b = document.getElementById(v === 'T' ? 'btnT' : 'btnF');
    var other = document.getElementById(v === 'T' ? 'btnF' : 'btnT');
    if (b) { b.classList.add('sel'); other.classList.remove('sel'); }
    var at = state.idx;
    setTimeout(function () {
      if (exam && !state.submitted && state.idx === at) go(at + 1);
    }, 180);
  }

  function go(i) {
    state.idx = Math.max(0, Math.min(ALL.length, i));
    save();
    render();
    window.scrollTo({ top: 0 });
  }

  function renderFinish() {
    var blanks = ALL.filter(function (q) { return state.answers[q.n] === undefined; });
    var html =
      '<div class="single">' +
        '<div class="progressbar"><div style="width:' + Math.round(answeredCount() / ALL.length * 100) + '%"></div></div>' +
        '<div class="qcard">' +
          '<h2 style="margin:0 0 0.6rem;border:none;padding:0">已到卷末 · 已答 ' + answeredCount() + ' / ' + ALL.length + '</h2>';
    if (blanks.length) {
      html += '<p>还有 <strong>' + blanks.length + '</strong> 题留空' +
        (exam.penalty ? '（本卷原规则答错倒扣，但有把握就答）' : '（考场上绝不留空！）') + '：</p><p class="blank-links">' +
        blanks.map(function (q) { return '<a href="#" data-n="' + q.n + '">Q' + q.n + '</a>'; }).join('') + '</p>';
    } else {
      html += '<p>全部作答完毕 🎉 可以交卷了。</p>';
    }
    html +=
          '<div class="qnav">' +
            '<button class="btn ghost" id="backBtn">← 回去检查</button>' +
            '<button class="btn primary" id="finishSubmit">交卷判分</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    appEl.innerHTML = html;

    appEl.querySelectorAll('.blank-links a').forEach(function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        var n = parseInt(a.dataset.n, 10);
        go(ALL.findIndex(function (q) { return q.n === n; }));
      });
    });
    document.getElementById('backBtn').addEventListener('click', function () { go(ALL.length - 1); });
    document.getElementById('finishSubmit').addEventListener('click', submit);
  }

  function renderResult() {
    var score = 0, wrong = 0, blank = 0, wrongList = [];
    ALL.forEach(function (q) {
      var user = state.answers[q.n];
      if (user === undefined) { blank++; wrongList.push(q.n); }
      else if (isCorrect(q, user)) score++;
      else { wrong++; wrongList.push(q.n); }
    });
    var g = exam.grades;
    var grade = score >= g.g5 ? '5（优秀）' : score >= g.g4 ? '4（良好）' : score >= g.g3 ? '3（及格）' : '未及格（及格线 ' + g.g3 + '）';

    var html =
      '<div class="result-banner">' +
        '<div><span class="score">' + score + '</span> / ' + ALL.length + ' · 等级：<strong>' + grade + '</strong></div>' +
        (exam.penalty ? '<div>按 2024 原卷规则（答错 −1、留空 0）：<strong>' + (score - wrong) + '</strong> 分</div>' : '') +
        '<div>错题/留空：' + (wrongList.length ? wrongList.map(function (n) { return '<a href="#q' + n + '">' + n + '</a>'; }).join(', ') : '无 🎉') +
        (blank ? '（其中留空 ' + blank + ' 题）' : '') + '</div>' +
        '<div style="color:var(--muted);font-size:0.9rem">复盘：点错题号跳到解析，再回<a href="index.html">知识手册</a>对应节看原理。</div>' +
      '</div>';

    exam.sections.forEach(function (sec) {
      html += '<div class="section-title">' + escapeHtml(sec.section) + '</div>';
      if (sec.context) html += sec.context;
      sec.questions.forEach(function (q) {
        var user = state.answers[q.n];
        var ok = user !== undefined && isCorrect(q, user);
        var cls = user === undefined ? 'blank-q' : (ok ? 'correct' : 'wrong');
        var correct = q.both ? 'T/F 均可' : (q.a ? 'T' : 'F');
        html +=
          '<div class="question ' + cls + '" id="q' + q.n + '">' +
            '<p class="stem"><span class="num">' + q.n + '.</span>' + escapeHtml(q.q) + '</p>' +
            '<div class="explain">' +
              (user === undefined ? '⚠️ <strong>留空</strong>' : (ok ? '✅ 答对' : '❌ 答错（你选 ' + (user === 'T' ? 'True' : 'False') + '）')) +
              ' · 正确答案 <strong>' + correct + '</strong> — ' + escapeHtml(q.e) +
            '</div>' +
          '</div>';
      });
    });
    appEl.innerHTML = html;
    window.scrollTo({ top: 0 });
  }

  function submit() {
    var done = answeredCount();
    if (done < ALL.length && !confirm('还有 ' + (ALL.length - done) + ' 题未作答。确定交卷？')) return;
    state.submitted = true;
    save();
    render();
  }

  // ---------- 键盘 ----------
  document.addEventListener('keydown', function (ev) {
    if (!exam || state.submitted || state.idx >= ALL.length) return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); answer('F'); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); answer('T'); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); go(state.idx - 1); }
  });

  submitBtn.addEventListener('click', submit);
  pickBtn.addEventListener('click', backToPicker);
  resetBtn.addEventListener('click', function () {
    if (!exam || !confirm('清空《' + exam.title + '》的所有作答？')) return;
    state = freshState();
    save();
    render();
    window.scrollTo({ top: 0 });
  });

  // 启动：上次在做的卷直接续上，否则进选卷页
  var cur = null;
  try { cur = localStorage.getItem(CUR_KEY); } catch (e) {}
  if (cur) openExam(cur); else renderPicker();
})();
</script>
</body>
</html>
